name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - dev    # deploy when pushing to `dev` branch
  workflow_dispatch: # allow manual dispatch from Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-path: ${{ steps.set-dist.outputs.dist-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (Angular)
        # This runs the project's build script and passes Angular CLI args to ensure
        # the output goes into ./dist and the base href is set to the repo path.
        run: npm run build -- --configuration production --output-path=./dist --base-href=/test-naturalisation/

      - name: Ensure SPA fallback (404 => index)
        run: |
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4